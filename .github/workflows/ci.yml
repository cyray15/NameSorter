name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'ci/**', 'test/**', 'docs/**', 'chore/**', 'dev/**', 'release/**', 'hotfix/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-format:
    name: Build, test & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore NameSorter.slnx
      - name: Verify formatting
        run: dotnet format NameSorter.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build NameSorter.slnx -c Release --no-restore
      - name: Test
        run: dotnet test NameSorter.slnx -c Release --no-restore
      - name: Calculate semantic version (push builds)
        if: github.event_name == 'push'
        run: |
          dotnet tool install --global GitVersion.Tool --version 6.8.2
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          "$HOME/.dotnet/tools/dotnet-gitversion" /output json
