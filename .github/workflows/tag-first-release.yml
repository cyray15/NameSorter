# Tag the validated first assessment release once CI passes on main.
# This is intentionally idempotent: an existing v1.0.0 tag is never moved.
name: Tag First Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tag-v1.0.0
  cancel-in-progress: false

jobs:
  tag-stable-release:
    name: Tag v1.0.0 after successful main CI
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create tag once on the latest validated main commit
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="v1.0.0"

          # Never reassign a release tag if someone already created it.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
            echo "$tag already exists; leaving it untouched."
            exit 0
          fi

          # Do not tag a stale CI run after a newer commit reached main.
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$remote_main" != "$RELEASE_SHA" ]]; then
            echo "CI commit $RELEASE_SHA is no longer main HEAD ($remote_main)." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$RELEASE_SHA" -m "Name Sorter coding assessment release $tag"
          git push origin "refs/tags/$tag"
          echo "Published $tag on $RELEASE_SHA"
